[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qutie"
version = "0.1.0"
description = "Linux label designer, CUPS driver and CLI for the PRT Qutie Bluetooth label printer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Topic :: Printing",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pillow"]

[project.optional-dependencies]
gui = ["PySide6", "qrcode", "python-barcode"]
test = ["pytest", "PySide6", "qrcode", "python-barcode"]

[project.scripts]
qutie = "qutie.cli:main"

[project.gui-scripts]
qutie-designer = "qutie.designer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

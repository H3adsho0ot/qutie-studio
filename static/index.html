<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Qutie Studio</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="brand">q<span>utie</span><small>STUDIO</small></div><div class="header-status-group"><div id="printerStatus" class="printer-status" role="status" aria-live="polite" aria-atomic="true" data-state="checking"><div class="printer-info"><strong id="printerModel">Qutie</strong><span id="printerFirmware"></span></div><span id="printerState" class="printer-state">Checking …</span><div id="printerBattery" class="printer-battery" hidden><span id="batteryIcon" class="battery-icon" role="img" aria-label="Battery level"><span id="batteryFill"></span></span><span id="batteryText"></span></div></div><button id="settings" class="settings-button" type="button" aria-label="Open tape and print settings" title="Tape &amp; print" aria-haspopup="dialog" aria-controls="settingsDialog"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button></div></header>
<main><aside class="template-sidebar"><h2>Templates</h2><button id="new" class="primary wide">＋ New template</button><div id="templates"></div><div class="aside-bottom"><button id="import" class="wide">Import template</button><input id="importFile" type="file" accept="application/json" hidden></div></aside>
<section class="workspace"><div class="titlebar"><div class="template-title"><input id="name" aria-label="Template name" value="My first label"><button id="editName" class="edit-name" type="button" aria-label="Edit template name" title="Edit template name"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15l-1 6z"/></svg></button></div><div><button id="save" class="save-button" type="button" aria-label="Save template" title="Save template"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M7 3v6h10V3M7 21v-8h10v8M14 5v2"/></svg></button></div></div>
<div class="tools"><button id="text">T Text</button><button id="image">▧ Image</button><input id="imageFile" type="file" accept="image/png,image/jpeg" hidden><button id="qr">▦ QR code</button><button id="rect">□ Frame</button><button id="line">╱ Line</button><span class="divider"></span><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button><button id="duplicate">Duplicate</button><button id="remove">Remove</button></div>
<div class="paper-area"><div class="measure"><div class="measure-controls"><input id="length" aria-label="Print width in millimetres" type="number" value="40" min="10" max="80" step="0.125"><span>mm</span><button id="autoLength" type="button" aria-pressed="false" title="Fit width to content">Auto</button></div></div><div class="tape"><div id="canvas" aria-label="Label editor with print raster" aria-busy="true"></div></div><p class="paper-caption">15 mm tape · 12 mm printable area · 203 dpi</p></div>
<div id="notice" role="status" aria-live="polite"></div></section>
<aside class="properties"><h2 id="elementTitle">Selected element</h2><div id="selectionHint">Click an element on the label.</div><div id="elementProps" hidden><label id="contentField"><span id="contentLabel" class="field-title">Text</span><textarea id="content" rows="3"></textarea></label><label id="fontSizeField">Font size <span>pt</span><input id="fontSize" type="number" min="5" max="96" value="24"></label><div id="fontStyleField" class="font-style-field"><div class="property-label">Style</div><div class="font-style-actions" role="group" aria-label="Text style"><button id="bold" type="button" title="Bold" aria-label="Bold" aria-pressed="false"><strong aria-hidden="true">B</strong></button><button id="italic" type="button" title="Italic" aria-label="Italic" aria-pressed="false"><em aria-hidden="true">I</em></button></div></div><label>Rotation <span>°</span><input id="rotation" type="number" value="0"></label><label id="strokeWidthField">Line width<input id="strokeWidth" type="number" min="1" max="10" value="1"></label><div class="element-actions"><div class="alignment-actions" role="group" aria-label="Alignment"><button id="centerHorizontal" type="button" aria-label="Center horizontally" title="Center horizontally"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 3"/><rect x="3" y="6" width="18" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="6" y="14" width="12" height="4" rx="1" fill="currentColor" stroke="none"/></svg></button><button id="centerVertical" type="button" aria-label="Center vertically" title="Center vertically"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18" stroke-dasharray="2 3"/><rect x="6" y="3" width="4" height="18" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="6" width="4" height="12" rx="1" fill="currentColor" stroke="none"/></svg></button></div><div class="stacking-actions" role="group" aria-label="Layers"><button id="front" type="button" aria-label="Bring to front" title="Bring to front"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="12" height="12" rx="1" stroke-dasharray="2 3"/><rect x="9" y="3" width="12" height="12" rx="1" fill="var(--icon-surface, white)"/><path d="M15 11V6m-2 2 2-2 2 2"/></svg></button><button id="back" type="button" aria-label="Send to back" title="Send to back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="12" height="12" rx="1" stroke-dasharray="2 3"/><rect x="3" y="9" width="12" height="12" rx="1" fill="var(--icon-surface, white)"/><path d="M9 13v5m-2-2 2 2 2-2"/></svg></button></div></div></div><hr><button id="print" class="primary print-button" type="button" aria-label="Print label" title="Print label" disabled><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5M6 17H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v7H7z"/><path d="M17 11h1"/></svg></button></aside></main>
<dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="settings-heading"><div class="eyebrow">SETTINGS</div><button id="settingsClose" type="button" class="dialog-close" aria-label="Close settings">×</button></div><h2 id="settingsTitle">Tape &amp; print</h2><div class="settings-fields"><label>Feed after printing <span>mm</span><input id="feed" type="number" value="14" min="0" max="30"></label><label>Length correction <span>%</span><input id="lengthScale" type="number" value="100" min="90" max="110" step="0.1"></label><label>Black threshold<input id="threshold" type="range" min="0" max="255" value="160"></label><label class="check"><input id="dither" type="checkbox"> Dither photos</label></div><form method="dialog" class="settings-footer"><button type="submit" class="primary wide">Done</button></form></dialog>
<script src="/static/vendor/konva.min.js"></script><script src="/static/label-size.js"></script><script src="/static/app.js"></script></body></html>
